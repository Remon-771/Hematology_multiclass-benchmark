[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cbcbench"
version = "1.0.0"
description = "Leakage-controlled multi-class haematological pattern classification from CBC data (ML and deep-learning benchmark)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.0",
  "scipy>=1.12",
  "scikit-learn>=1.4",
  "imbalanced-learn>=0.12",
  "matplotlib>=3.8",
  "seaborn>=0.13",
  "joblib>=1.3"
]

[project.optional-dependencies]
full = ["lightgbm>=4.0", "xgboost>=2.0", "catboost>=1.2", "optuna>=3.6", "shap>=0.45", "statsmodels>=0.14",
        "scikit-posthocs>=0.9", "torch>=2.2", "pytorch-tabnet>=4.1", "jupyterlab>=4", "nbconvert>=7"]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["full: needs the optional 'full' dependencies"]
