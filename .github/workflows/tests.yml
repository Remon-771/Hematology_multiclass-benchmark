name: CI — reproducibility checks
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install -e '.[test]'
      - name: Release audit (dataset checksum, results inventory)
        run: python scripts/12_release_audit.py
      - name: Dataset contract, protocol and committed-results tests
        run: python -m pytest -q
